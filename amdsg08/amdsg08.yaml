number:
  - platform: modbus_controller
    modbus_controller_id: ${amdsg08_prefix}_modbus_controller
    name: "${amdsg08_prefix} RS485 Address"
    register_type: holding
    address: 0x00FD
    value_type: U_WORD
    min_value: 1
    max_value: 247
    step: 1
    mode: box
    lambda: "return int(x);"
    write_lambda: "return uint16_t(x);"

  - platform: modbus_controller
    modbus_controller_id: ${amdsg08_prefix}_modbus_controller
    name: "${amdsg08_prefix} Baud Rate"
    register_type: holding
    address: 0x00FE
    value_type: U_WORD
    min_value: 0
    max_value: 7
    step: 1
    mode: box
    lambda: "return int(x);"
    write_lambda: "return uint16_t(x);"

  - platform: modbus_controller
    modbus_controller_id: ${amdsg08_prefix}_modbus_controller
    name: "${amdsg08_prefix} Parity"
    register_type: holding
    address: 0x00FF
    value_type: U_WORD
    min_value: 0
    max_value: 2
    step: 1
    mode: box
    lambda: "return int(x);"
    write_lambda: "return uint16_t(x);"

  - platform: modbus_controller
    modbus_controller_id: ${amdsg08_prefix}_modbus_controller
    name: "${amdsg08_prefix} Auto Temp Report Interval"
    register_type: holding
    address: 0x00F6
    value_type: U_WORD
    min_value: 0
    max_value: 255
    step: 1
    unit_of_measurement: "s"
    mode: box
    lambda: "return int(x);"
    write_lambda: "return uint16_t(x);"

  - platform: modbus_controller
    modbus_controller_id: ${amdsg08_prefix}_modbus_controller
    name: "${amdsg08_prefix} Channel 1 Offset"
    register_type: holding
    address: 0x00C0
    value_type: S_WORD
    min_value: -100.0
    max_value: 100.0
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    lambda: "return x * 0.1;"
    write_lambda: "return int16_t(round(x * 10));"

