substitutions:
  amdsg08_prefix: "amdsg08"
  amdsg08_modbus_address: "0x01"
  amdsg08_update_interval: 30s

  # Default sensor names
  amdsg08_sensor_1_name: "DS18B20 Channel 1"
  amdsg08_sensor_2_name: "DS18B20 Channel 2"
  amdsg08_sensor_3_name: "DS18B20 Channel 3"
  amdsg08_sensor_4_name: "DS18B20 Channel 4"
  amdsg08_sensor_5_name: "DS18B20 Channel 5"
  amdsg08_sensor_6_name: "DS18B20 Channel 6"
  amdsg08_sensor_7_name: "DS18B20 Channel 7"
  amdsg08_sensor_8_name: "DS18B20 Channel 8"

modbus_controller:
  - id: ${amdsg08_prefix}_modbus_controller
    address: ${amdsg08_modbus_address}
    modbus_id: modbus1
    setup_priority: -10
    update_interval: ${amdsg08_update_interval}

sensor:
  - platform: modbus_controller
    modbus_controller_id: ${amdsg08_prefix}_modbus_controller
    name: ${amdsg08_sensor_1_name}
    register_type: holding
    address: 0x00A0
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    value_type: U_WORD
    lambda: "if (x == 32768) return NAN; return x * 0.1;"

  - platform: modbus_controller
    modbus_controller_id: ${amdsg08_prefix}_modbus_controller
    name: ${amdsg08_sensor_2_name}
    register_type: holding
    address: 0x00A1
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    value_type: U_WORD
